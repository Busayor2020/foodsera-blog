<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<a href="Main.dc.html" style="height: 100%; display: flex; flex-direction: column; text-decoration: none; color: #22201C; background: #FFFDF8; border: 1px solid #E8DECB; border-radius: 16px; overflow: hidden; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; line-height: 1.4">
<dc-import name="Photo" tone="{{tone}}" alt="{{alt}}" ratio="4 / 3" round="0px" hint-size="100%,220px"></dc-import>
<div style="padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1">
<span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #2F6B3A">{{cat}}</span>
<h3 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 20px; line-height: 1.2; text-wrap: balance">{{title}}</h3>
<div style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; color: #5E574D">
<span style="display: flex; align-items: center; gap: 5px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{time}}</span>
<span>{{diff}}</span>
<span style="display: flex; align-items: center; gap: 4px; color: #22201C"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#E0A21B" stroke="#B57F0E" stroke-width="1"></path></svg><span><strong>{{rating}}</strong><span style="position: absolute; left: -9999px"> out of 5</span></span></span>
</div>
</div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":320,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item || { title: 'Smoky Party Jollof Rice', cat: 'Rice Dishes', time: '1 hr 15 min', diff: 'Easy', rating: '4.9', tone: 'jollof' };
    return {
      title: it.title, cat: it.cat, time: it.time, diff: it.diff, rating: it.rating, tone: it.tone || 'jollof',
      alt: it.alt || ('Photo of ' + it.title)
    };
  }
}
</script>
</body>
</html>
