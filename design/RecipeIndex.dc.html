<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe index A to Z · Foodsera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF5EA}
*{box-sizing:border-box}
a{color:#22201C}a:hover{color:#B3390E}
:focus-visible{outline:3px solid #2F6B3A;outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:'Young Serif',Georgia,serif;font-weight:400;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
html{scroll-behavior:smooth}
</style>
</helmet>
<div style="background: #FBF5EA; color: #22201C; font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; font-size: 17px; line-height: 1.6">
<div style="position: sticky; top: 0; z-index: 50">
<dc-import name="Header" current="none" ads="{{ads}}" on-toggle-ads="{{toggleAds}}" hint-size="100%,116px"></dc-import>
</div>
<main id="main" style="max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; display: flex; flex-direction: column; gap: 36px">
<header style="display: flex; flex-direction: column; gap: 12px">
<nav aria-label="Breadcrumb" style="font-size: 14px"><a href="Home.dc.html" style="color: #5E574D">Home</a> <span aria-hidden="true" style="color: #5E574D">›</span> <span style="font-weight: 600">Recipe index</span></nav>
<h1 style="font-size: clamp(36px, 5vw, 54px); line-height: 1.05">Every Foodsera recipe, A to Z</h1>
<p style="font-size: 18px; color: #3F3A33; max-width: 680px">All {{total}} recipes, grouped by category and sorted alphabetically. Jump to a section, or use your browser’s find to look for a dish.</p>
<nav aria-label="Jump to category" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
<a href="#{{g.id}}" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-radius: 999px; background: #FFFDF8; border: 1px solid #D9CBB0; text-decoration: none; font-weight: 600; font-size: 15px">{{g.name}} <span style="color: #5E574D; font-weight: 500">{{g.count}}</span></a>
</sc-for>
</nav>
</header>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
<section id="{{g.id}}" aria-labelledby="{{g.hid}}" style="display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 120px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 2px solid #22201C; padding-bottom: 8px">
<h2 id="{{g.hid}}" style="font-size: 30px">{{g.name}}</h2>
<a href="Category.dc.html" style="font-size: 15px; font-weight: 700; color: #B3390E; min-height: 44px; display: flex; align-items: center">View category</a>
</div>
<ul style="list-style: none; margin: 0; padding: 0; columns: 3 240px; column-gap: 32px">
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="6">
<li style="break-inside: avoid; border-bottom: 1px dashed #E2D6BF">
<a href="Main.dc.html" style="min-height: 46px; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-decoration: none">
<span style="font-weight: 600">{{i.title}}</span>
<span style="font-size: 14px; color: #5E574D; white-space: nowrap">{{i.time}}</span>
</a>
</li>
</sc-for>
</ul>
<sc-if value="{{g.adAfter}}" hint-placeholder-val="{{false}}">
<div style="padding-top: 24px">
<dc-import name="Ad" kind="incontent" variant="2" hint-size="100%,300px"></dc-import>
</div>
</sc-if>
</section>
</sc-for>
</main>
<dc-import name="Footer" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showAds":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":3600}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const ads = s.ads ?? this.props.showAds ?? false;
    const G = [
      ['soups', 'Soups & Stews', [['Afang Soup', '1 hr 10 min'], ['Banga Soup', '1 hr 15 min'], ['Black Soup (Omoebe)', '1 hr 10 min'], ['Catfish Pepper Soup', '30 min'], ['Edikang Ikong', '1 hr 10 min'], ['Efo Riro', '50 min'], ['Egusi Soup with Ugu', '1 hr 20 min'], ['Ewedu Soup', '20 min'], ['Fisherman Soup', '50 min'], ['Gbegiri (Bean Soup)', '1 hr'], ['Goat Meat Pepper Soup', '1 hr'], ['Miyan Kuka', '45 min'], ['Nigerian Chicken Stew', '1 hr'], ['Ofada Stew (Ayamase)', '1 hr 30 min'], ['Ofe Onugbu (Bitterleaf Soup)', '1 hr 30 min'], ['Okra Soup', '35 min'], ['Owo Soup', '1 hr']]],
      ['rice', 'Rice Dishes', [['Coconut Rice', '50 min'], ['Concoction Rice', '45 min'], ['Jollof Spaghetti', '35 min'], ['Nigerian Fried Rice', '1 hr'], ['Ofada Rice', '40 min'], ['Rice and Beans', '1 hr'], ['Smoky Party Jollof Rice', '1 hr 15 min']]],
      ['swallow', 'Swallow', [['Amala', '15 min'], ['Eba', '5 min'], ['Fufu (Akpu)', '20 min'], ['Pounded Yam', '30 min'], ['Semo', '10 min'], ['Tuwo Shinkafa', '40 min']]],
      ['snacks', 'Small Chops & Snacks', [['Beef Suya', '45 min'], ['Meat Pie', '1 hr 30 min'], ['Moi Moi in Foil', '1 hr 30 min'], ['Puff-Puff', '1 hr 10 min'], ['Scotch Eggs', '45 min'], ['Spring Rolls', '1 hr'], ['Peppered Gizzard', '40 min']]],
      ['breakfast', 'Breakfast', [['Akara', '30 min'], ['Dodo and Egg Sauce', '20 min'], ['Fried Yam and Pepper Sauce', '25 min'], ['Nigerian Pancakes', '15 min'], ['Ogi (Pap) with Akara', '20 min'], ['Yam Porridge (Asaro)', '45 min']]],
      ['drinks', 'Drinks', [['Chapman', '10 min'], ['Kunu Aya (Tiger Nut Drink)', '30 min'], ['Zobo Drink', '40 min'], ['Pineapple Ginger Juice', '15 min']]],
      ['desserts', 'Desserts', [['Chin Chin', '1 hr'], ['Coconut Candy', '40 min'], ['Nigerian Buns', '45 min'], ['Plantain Mosa', '25 min']]]
    ];
    let total = 0;
    const groups = G.map((g, gi) => {
      const items = g[2].slice().sort((a, b) => a[0].localeCompare(b[0])).map((i) => ({ title: i[0], time: i[1] }));
      total += items.length;
      return { id: 'cat-' + g[0], hid: 'h-' + g[0], name: g[1], count: items.length, items, adAfter: ads && gi === 1 };
    });
    return { ads, toggleAds: () => this.setState({ ads: !ads }), groups, total };
  }
}
</script>
</body>
</html>
